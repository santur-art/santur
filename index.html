    radial-gradient(115% 85% at 50% 38%, rgba(26,29,38,.30), rgba(26,29,38,.86) 82%),

  .email{color:var(--saffron);text-decoration:none}
  .email:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){.bg,main{animation:none}.bg{transform:none}}

  .disclaimer{margin-top:7px;font-size:.6rem;line-height:1.55;color:var(--muted);opacity:.42}
